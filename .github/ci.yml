name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  server:
  name: Server CI
  runs-on: ubuntu-latest

  defaults:
    run:
      working-directory: server

      steps:
        - name: checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
           node-version: 22
           cache: npm
           cache-dependency-path: server/package-lock.json

        - name: Install dependencies
          run: npm ci

        - name: Typecheck
          run: npm run typecheck
        
        - name: Build
          run: npm run build
  
  client:
    name: Client CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build